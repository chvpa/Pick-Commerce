packages:
  - 'packages/*'
  - 'apps/*'

# Scripts de instalación permitidos. pnpm bloquea el resto por defecto:
# un paquete nuevo que quiera ejecutar código al instalarse tiene que listarse acá.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.5'
  - '@tanstack/react-query@5.102.5'
